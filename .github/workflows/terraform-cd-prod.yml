name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA de la imagen a desplegar"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr
        run: |
          echo "login_server=$(az acr show \
            --name ${{ vars.ACR_NAME }} \
            --query loginServer \
            --output tsv)" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name petproject-prod-ca-01 \
            --resource-group ${{ vars.PROD_RESOURCE_GROUP_NAME }} \
            --image ${{ steps.acr.outputs.login_server }}/frontend:${{ inputs.image_tag }}

      - name: Deploy backend
        run: |
          az containerapp update \
            --name petproject-prod-ca-02 \
            --resource-group ${{ vars.PROD_RESOURCE_GROUP_NAME }} \
            --image ${{ steps.acr.outputs.login_server }}/productserver:${{ inputs.image_tag }}
